server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location = /og-image.png {
        alias /usr/share/nginx/html/og-image.png;
        expires 7d;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Smio" />
<meta property="og:title" content="Smio - 스마트 팀 주문" />
<meta property="og:description" content="주문방이 열렸습니다. 접속해서 주문하세요!" />
<meta property="og:image" content="https://smio-mobile.johnbae.co.kr/og-image.png" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="1024" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://smio-mobile.johnbae.co.kr/og-image.png" />
</head>';
        try_files $uri /index.html;
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Smio" />
<meta property="og:title" content="Smio - 스마트 팀 주문" />
<meta property="og:description" content="주문방이 열렸습니다. 접속해서 주문하세요!" />
<meta property="og:image" content="https://smio-mobile.johnbae.co.kr/og-image.png" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="1024" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://smio-mobile.johnbae.co.kr/og-image.png" />
</head>';
        try_files $uri $uri/ /index.html;
    }
}
