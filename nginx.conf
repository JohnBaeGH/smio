server {
    listen 8080;

    # OG 이미지 / 정적 파일 서빙
    location /static/ {
        alias /app/static/;
        expires 7d;
    }

    # FastAPI — 모바일 앱 API 요청
    location /api/ {
        proxy_pass http://host.docker.internal:5005/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Streamlit WebSocket (OG 주입 없이 그대로 프록시)
    location /_stcore/stream {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # 나머지 모든 요청: Streamlit 프록시 + OG 태그 주입
    location / {
        proxy_pass http://localhost:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept-Encoding "";  # gzip 비활성화 (sub_filter 필수)

        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</head>' '
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Smio" />
<meta property="og:title" content="Smio - 스마트 팀 주문" />
<meta property="og:description" content="네이버 플레이스 URL 하나로 팀 단체 주문을 쉽게" />
<meta property="og:image" content="https://smio2.johnbae.co.kr/static/og-image.png" />
<meta property="og:image:width" content="512" />
<meta property="og:image:height" content="512" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://smio2.johnbae.co.kr/static/og-image.png" />
</head>';
    }
}
