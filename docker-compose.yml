version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: smio-api
    ports:
      - "5005:5000"
    environment:
      - BASE_URL=https://smio2.johnbae.co.kr
    volumes:
      - smio_rooms:/app/rooms
      - smio_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: smio-web
    ports:
      - "3200:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  smio_rooms:
  smio_logs:


